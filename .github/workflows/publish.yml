name: Publish M32 Setup

on:
  push:
    branches:
      - UAT
      - main
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish
        required: true
        type: choice
        options:
          - publish to UAT
          - publish to prod

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

concurrency:
  group: m32-setup-pages
  cancel-in-progress: false

jobs:
  publish:
    name: ${{ github.ref == 'refs/heads/UAT' && 'Publish UAT' || 'Publish Production' }}
    if: >-
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/UAT' || github.ref == 'refs/heads/main')) ||
      (github.event_name == 'workflow_dispatch' &&
       ((inputs.target == 'publish to UAT' && github.ref == 'refs/heads/UAT') ||
        (inputs.target == 'publish to prod' && github.ref == 'refs/heads/main')))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      target: ${{ steps.target.outputs.value }}
    steps:
      - name: Determine publication target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            if [[ "${GITHUB_REF}" == "refs/heads/UAT" ]]; then
              echo "value=publish to UAT" >> "$GITHUB_OUTPUT"
            else
              echo "value=publish to prod" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "value=${{ inputs.target }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out source
        uses: actions/checkout@v7

      - name: Check out published-site archive
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: previous-site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Assemble site
        shell: bash
        env:
          TARGET: ${{ steps.target.outputs.value }}
        run: |
          set -euo pipefail
          mkdir -p site

          if [[ -d previous-site ]]; then
            rsync -a --exclude='.git/' previous-site/ site/
          fi

          # The old /dev/ address is retired; UAT now lives at /uat/.
          rm -rf site/dev

          if [[ "$TARGET" == "publish to UAT" ]]; then
            mkdir -p site/uat
            cp index.html app.js styles.css site/uat/
          else
            VERSION="v$(date -u +'%Y.%m.%d')-${GITHUB_RUN_NUMBER}"
            cp index.html app.js styles.css site/
            mkdir -p "site/versions/${VERSION}"
            cp index.html app.js styles.css "site/versions/${VERSION}/"
            echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          fi

          touch site/.nojekyll

      # Use git directly rather than a Node-based publishing action. This
      # keeps the workflow on supported action runtimes and retains history.
      - name: Save published-site archive
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' site/ previous-site/
          git -C previous-site config user.name "github-actions[bot]"
          git -C previous-site config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C previous-site add -A
          if git -C previous-site diff --cached --quiet; then
            echo "Published-site archive is already up to date."
          else
            git -C previous-site commit -m "Publish site archive"
            git -C previous-site push origin HEAD:gh-pages
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Write publication summary
        shell: bash
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          TARGET: ${{ steps.target.outputs.value }}
        run: |
          set -euo pipefail
          SITE_URL="${SITE_URL%/}"

          if [[ "$TARGET" == "publish to UAT" ]]; then
            PUBLISHED_URL="${SITE_URL}/uat/"
            {
              echo "## M32 Setup published"
              echo
              echo "- **Target:** UAT"
              echo "- **Published app:** [Open UAT build](${PUBLISHED_URL})"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            VERSION_URL="${SITE_URL}/versions/${VERSION}/"
            {
              echo "## M32 Setup published"
              echo
              echo "- **Target:** Production"
              echo "- **Version:** ${VERSION}"
              echo "- **Versioned app:** [Open ${VERSION}](${VERSION_URL})"
              echo "- **Current production app:** [Open production site](${SITE_URL}/)"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  sync-main-to-uat:
    name: Merge main into UAT and publish UAT
    needs: publish
    if: >-
      needs.publish.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Merge main into UAT
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin UAT
          git checkout -B UAT origin/UAT
          git merge --no-edit origin/main
          git push origin UAT

      - name: Trigger UAT publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/publish.yml/dispatches" \
            -f ref=UAT \
            -f 'inputs[target]=publish to UAT'
