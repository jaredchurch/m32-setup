name: Publish M32 Setup

on:
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish
        required: true
        type: choice
        options:
          - publish to dev
          - publish to prod

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: m32-setup-pages
  cancel-in-progress: false

jobs:
  publish:
    name: ${{ inputs.target }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      # Keep gh-pages as a durable archive of the published site so that
      # previous production versions survive subsequent Pages deployments.
      - name: Check out published-site archive
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: previous-site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Assemble site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site

          if [[ -d previous-site ]]; then
            rsync -a --exclude='.git/' previous-site/ site/
          fi

          if [[ "${{ inputs.target }}" == "publish to dev" ]]; then
            mkdir -p site/dev
            cp index.html app.js styles.css site/dev/
          else
            VERSION="v$(date -u +'%Y.%m.%d')-${GITHUB_RUN_NUMBER}"
            cp index.html app.js styles.css site/
            mkdir -p "site/versions/${VERSION}"
            cp index.html app.js styles.css "site/versions/${VERSION}/"
            echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          fi

          touch site/.nojekyll

      - name: Save published-site archive
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site
          keep_files: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Write publication summary
        shell: bash
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          SITE_URL="${SITE_URL%/}"

          if [[ "${{ inputs.target }}" == "publish to dev" ]]; then
            PUBLISHED_URL="${SITE_URL}/dev/"
            {
              echo "## M32 Setup published"
              echo
              echo "- **Target:** Development"
              echo "- **Published app:** [Open development build](${PUBLISHED_URL})"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            VERSION_URL="${SITE_URL}/versions/${VERSION}/"
            {
              echo "## M32 Setup published"
              echo
              echo "- **Target:** Production"
              echo "- **Version:** ${VERSION}"
              echo "- **Versioned app:** [Open ${VERSION}](${VERSION_URL})"
              echo "- **Current production app:** [Open production site](${SITE_URL}/)"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
