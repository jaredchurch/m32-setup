name: Publish M32 Setup

on:
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish
        required: true
        type: choice
        options:
          - publish to dev
          - publish to prod

permissions:
  contents: write

concurrency:
  group: m32-setup-pages
  cancel-in-progress: false

jobs:
  publish:
    name: ${{ inputs.target }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Create publication directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish
          cp index.html app.js styles.css publish/

          if [[ "${{ inputs.target }}" == "publish to prod" ]]; then
            VERSION="v$(date -u +'%Y.%m.%d')-${GITHUB_RUN_NUMBER}"
            mkdir -p "publish/versions/${VERSION}"
            cp index.html app.js styles.css "publish/versions/${VERSION}/"
            echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          fi

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./publish
          destination_dir: ${{ inputs.target == 'publish to dev' && 'dev' || '.' }}
          keep_files: true

      - name: Write publication summary
        shell: bash
        run: |
          set -euo pipefail
          SITE_URL="https://jaredchurch.github.io/m32-setup"

          if [[ "${{ inputs.target }}" == "publish to dev" ]]; then
            PUBLISHED_URL="${SITE_URL}/dev/"
            {
              echo "## M32 Setup published"
              echo
              echo "- **Target:** Development"
              echo "- **Published app:** [Open development build](${PUBLISHED_URL})"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            VERSION_URL="${SITE_URL}/versions/${VERSION}/"
            {
              echo "## M32 Setup published"
              echo
              echo "- **Target:** Production"
              echo "- **Version:** ${VERSION}"
              echo "- **Versioned app:** [Open ${VERSION}](${VERSION_URL})"
              echo "- **Current production app:** [Open production site](${SITE_URL}/)"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
